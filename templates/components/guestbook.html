<section class="zr gb" id="guestbook">
    <div class="zr-wrap">
        <div class="sec-head">
            <h2 class="sec">Guestbook</h2>
        </div>
        <div class="log" id="log">
            <div class="log-row head">
                <span class="say">№</span><span></span><span class="say">name</span><span class="say">note</span><span class="say dt-h">signed</span>
            </div>
            {% for guest in guest_list %}
            <div class="log-row">
                <span class="no">{{ forloop.counter|stringformat:"02d" }}</span>
                {% if guest.icon %}<img src="{{ guest.icon_src }}" alt="">{% else %}<span class="pen" aria-hidden="true"></span>{% endif %}
                <span class="nm">{{ guest.name }}</span>
                <span class="nt">{{ guest.message }}</span>
                <span class="dt">{{ guest.created_at|date:"j M Y" }}</span>
            </div>
            {% endfor %}
            <form class="log-row sign" id="sign" method="post" action="{% url 'main:create_peer' %}">
                {% csrf_token %}
                <span class="no" id="sign-no">{{ guest_list|length|add:1|stringformat:"02d" }}</span>
                <button type="button" class="pen pen-btn" id="gb-photo-toggle"
                        aria-expanded="false" aria-controls="gb-icon"
                        title="Add a photo (optional)">+</button>
                <input id="gb-name" name="name" placeholder="your name" aria-label="Your name" maxlength="100" required>
                <input id="gb-note" name="message" placeholder="leave a message!" aria-label="Your note" maxlength="256" required>
                <button class="btn" type="submit">sign</button>
                <input id="gb-icon" class="gb-icon" name="icon" type="url"
                       placeholder="photo url, optional · a google drive share link works"
                       aria-label="Photo URL (optional)" maxlength="255" hidden>
            </form>
            <div class="log-row blank" aria-hidden="true"></div>
            <div class="log-row blank" aria-hidden="true"></div>
        </div>
    </div>
</section>
    <script>
    /* The sign row posts with fetch and the new signature drops in above it */
    (function () {
        var form = document.getElementById("sign");
        if (!form) return;
        var photoToggle = document.getElementById("gb-photo-toggle");
        var photoInput = document.getElementById("gb-icon");
        var numberEl = document.getElementById("sign-no");

        function esc(value) {
            var div = document.createElement("div");
            div.textContent = value == null ? "" : value;
            return div.innerHTML.replace(/"/g, "&quot;");
        }
        function pad2(n) { return (n < 10 ? "0" : "") + n; }

        photoToggle.addEventListener("click", function () {
            photoInput.hidden = !photoInput.hidden;
            photoToggle.setAttribute("aria-expanded", String(!photoInput.hidden));
            if (!photoInput.hidden) photoInput.focus();
        });

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            var submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            fetch(form.action, {
                method: "POST",
                headers: { "X-Requested-With": "XMLHttpRequest" },
                body: new FormData(form),   // carries csrfmiddlewaretoken
            }).then(function (response) {
                return response.json().catch(function () { return {}; }).then(function (result) {
                    if (!response.ok) {
                        var message = result.errors
                            ? Object.values(result.errors).flat().map(function (e) { return e.message; }).join(" ")
                            : "Something went wrong (status " + response.status + ").";
                        showToast("Not signed", message, "error");
                        return;
                    }
                    var row = document.createElement("div");
                    row.className = "log-row is-new";
                    row.innerHTML =
                        '<span class="no">' + esc(numberEl.textContent) + "</span>" +
                        (result.icon_url ? '<img src="' + esc(result.icon_url) + '" alt="">' : '<span class="pen" aria-hidden="true"></span>') +
                        '<span class="nm">' + esc(result.name) + "</span>" +
                        '<span class="nt">' + esc(result.message) + "</span>" +
                        '<span class="dt">' + esc(result.signed) + "</span>";
                    form.before(row);
                    numberEl.textContent = pad2(parseInt(numberEl.textContent, 10) + 1);
                    form.reset();
                    photoInput.hidden = true;
                    photoToggle.setAttribute("aria-expanded", "false");
                    showToast("Signed", "Thanks for stopping by!", "success");
                });
            }).catch(function (error) {
                console.error("Error signing the guestbook:", error);
                showToast("Not signed", "Could not reach the server. Please try again.", "error");
            }).finally(function () {
                submitButton.disabled = false;
            });
        });
    })();
    </script>
