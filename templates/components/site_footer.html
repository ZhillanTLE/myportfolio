{% load static %}
<footer class="zr site-foot" id="site-footer">
    <div class="zr-wrap">
        <!-- Drawn by bouquet.js from a Desmos graph; each flower sways, blooms on hover and sheds petals on click.
             It sits on the footer's top border, half in the guestbook's bottom padding -->
        <div class="bouquet">
            <canvas class="bouquet-canvas" id="bouquet-canvas" tabindex="0" role="button"
                    aria-label="A bouquet of flowers. Press Enter to read the note tied to it."
                    aria-controls="bouquet-note" aria-expanded="false"></canvas>
            <div class="bouquet-side">
                <p class="bouquet-hint">Click a flower, or the wrapping for the note.</p>
                <aside class="bouquet-note" id="bouquet-note" hidden>
                    <span class="to">untuk {% if user.is_authenticated %}{{ user.username }}{% else %}kamu{% endif %}</span>
                    <p id="bouquet-message">terima kasih, ya, sudah kerja keras selalu :]</p>
                    <button type="button" data-close aria-label="Close note">×</button>
                </aside>
            </div>
        </div>

        <div class="foot-row">
            <p class="foot-gh">
                <a href="https://github.com/ZhillanTLE" target="_blank" rel="noopener" id="gh-link">
                    <span id="gh-total">My contributions</span> in the last year on <span class="u">GitHub</span> ↗
                </a>
            </p>
            <nav class="foot-contact" aria-label="Contact">
                <span class="lbl">Contact</span>
                <a href="https://www.linkedin.com/in/zhillan-baniaksa-0b9244235/" target="_blank" rel="noopener">LinkedIn ↗</a>
                <a href="mailto:zhillan.baniaksa@ui.ac.id">Email ↗</a>
            </nav>
        </div>

        <!-- Drawn by contributions.js from get_github_contributions; stays empty if GitHub can't be reached -->
        <div class="gh-graph" id="gh-graph" data-endpoint="{% url 'main:get_github_contributions' %}" hidden>
            <div class="gh-grid" id="gh-grid" role="img"></div>
        </div>
    </div>
</footer>
<script src="{% static 'js/contributions.js' %}?v=4" defer></script>
<script src="{% static 'js/bouquet.js' %}?v=2" defer></script>
