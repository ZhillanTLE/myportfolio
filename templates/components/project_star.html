{% if user.is_authenticated %}
<form method="post" action="{% url 'main:toggle_star' project.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="star{% if user in project.starred_by.all %} is-starred{% endif %}"
            aria-pressed="{% if user in project.starred_by.all %}true{% else %}false{% endif %}">
        <span class="star-icon" aria-hidden="true">★</span>
        {% if user in project.starred_by.all %}Starred{% else %}Star{% endif %}
        <span class="star-count">{{ project.starred_by.count }}</span>
    </button>
</form>
{% else %}
<a class="star" href="{% url 'main:login' %}?next={{ request.path }}">
    <span class="star-icon" aria-hidden="true">★</span>
    Log in to star
    <span class="star-count">{{ project.starred_by.count }}</span>
</a>
{% endif %}
