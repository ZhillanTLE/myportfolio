  {% load static %}
  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ name }} - Portfolio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">
        {% block meta %} {% endblock meta %}
  </head>
  <body>
    <header class ="site-header">
        <div class="container">
            <nav class="nav-jump">
                <a href="{% url 'main:show_main' %}">Profile</a>
            </nav>
            <nav class="nav-jump">
                <a href="{% url 'main:show_projects'%}">Work</a>
            </nav>
        </div>
    </header>
    {% block content %} {% endblock content %}

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}, {{ npm }} {{ study_program }}, {{ bio}} </p>
        </div>
    </footer>
  </body>
  </html>
